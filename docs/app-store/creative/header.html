<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jak;src:url(../../../public/fonts/plus-jakarta-sans-latin-wght-normal.woff2);font-weight:200 800}
*{margin:0;box-sizing:border-box}
html,body{width:3840px;height:1646px;overflow:hidden}
body{font-family:Jak;background:#0C4A44;position:relative;color:#fff}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 3px,transparent 3.4px);background-size:54px 54px}
.glow{position:absolute;left:50%;top:62%;width:2200px;height:2200px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(115,216,200,.34),rgba(115,216,200,0) 62%)}
.ring{position:absolute;left:50%;top:62%;width:1500px;height:1500px;transform:translate(-50%,-50%);border-radius:50%;border:8px solid rgba(255,255,255,.07)}
.lime{position:absolute;border-radius:50%;background:#C6F432;width:900px;height:900px;right:-300px;bottom:-560px}
.lime2{position:absolute;border-radius:50%;background:#FF6A2B;width:520px;height:520px;left:-200px;top:-260px;opacity:.9}
h1{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:800;font-size:150px;line-height:1;letter-spacing:-.035em}
h1 span{color:#FF6A2B}
.m{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
#rex{height:1000px;left:50%;top:480px;transform:translateX(-82%)}
#peg{height:640px;left:50%;top:840px;transform:translateX(12%)}
</style></head><body>
<div class="dots"></div><div class="glow"></div><div class="ring"></div><div class="lime"></div><div class="lime2"></div>
<h1>Start easy, <span>sell smarter.</span></h1>
<img class="m" id="rex" src="mascots/rex.png"><img class="m" id="peg" src="mascots/peggy.png">
</body></html>
